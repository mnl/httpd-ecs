name: Update base image digest

on:
  schedule:
    - cron: "17 6 * * *" # Daily at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digestabot
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Sign Digestabot commits with gitsign

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Refresh the base image update PR
        uses: chainguard-dev/digestabot@33d0b78e580aa0c83fe188eb3dfad6611b662479 # v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          include-files: Dockerfile
          branch-for-pr: digestabot/base-image
          title-for-pr: Update Wolfi base image digest
          commit-message: Update Wolfi base image digest
          labels-for-pr: dependencies
          description-for-pr: |
            Update the pinned Wolfi base image to the current digest of latest.
          signoff: "true"
